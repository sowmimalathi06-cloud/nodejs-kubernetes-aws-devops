apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-nodejs

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudops-nodejs

  template:
    metadata:
      labels:
        app: cloudops-nodejs

    spec:
      containers:
        - name: nodejs-container

          image: nodejs-devops-demo:v5

          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"
